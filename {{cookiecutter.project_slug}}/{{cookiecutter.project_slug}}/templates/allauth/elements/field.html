{% raw %}{% load allauth %}
{% load crispy_forms_tags %}

{% if attrs.type == "textarea" %}
  <div class="{% endraw %}{% if cookiecutter.use_htmx_alpine_tailwind == 'y' %}mb-3{% else %}row mb-3{% endif %}{% raw %}">
    <div{% endraw %}{% if cookiecutter.use_htmx_alpine_tailwind != 'y' %} class="col-sm-10"{% endif %}{% raw %}>
      <label for="{{ attrs.id }}">
        {% slot label %}
      {% endslot %}
    </label>
  </div>
  <textarea {% if attrs.required %}required{% endif %}
            {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %}
            {% if attrs.disabled %}disabled{% endif %}
            {% if attrs.readonly %}readonly{% endif %}
            {% if attrs.checked %}checked{% endif %}
            {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
            {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
            {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
            class="{% endraw %}{% if cookiecutter.use_htmx_alpine_tailwind == 'y' %}mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500{% else %}form-control{% endif %}{% raw %}">{% slot value %}{% endslot %}</textarea>
</div>
{% elif attrs.type == "radio" %}
<div class="{% endraw %}{% if cookiecutter.use_htmx_alpine_tailwind == 'y' %}mb-3{% else %}row mb-3{% endif %}{% raw %}">
  <div{% endraw %}{% if cookiecutter.use_htmx_alpine_tailwind != 'y' %} class="col-sm-10"{% endif %}{% raw %}>
    <div class="{% endraw %}{% if cookiecutter.use_htmx_alpine_tailwind == 'y' %}flex items-center gap-2{% else %}form-check{% endif %}{% raw %}">
      <input {% if attrs.required %}required{% endif %}
             {% if attrs.disabled %}disabled{% endif %}
             {% if attrs.readonly %}readonly{% endif %}
             {% if attrs.checked %}checked{% endif %}
             {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
             {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
             {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
             {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
             value="{{ attrs.value|default_if_none:"" }}"
             type="{{ attrs.type }}" />
      <label class="{% endraw %}{% if cookiecutter.use_htmx_alpine_tailwind == 'y' %}text-sm text-gray-700{% else %}form-check-label{% endif %}{% raw %}" for="{{ attrs.id }}">
        {% slot label %}
      {% endslot %}
    </label>
  </div>
</div>
</div>
{% else %}
<div{% endraw %}{% if cookiecutter.use_htmx_alpine_tailwind != 'y' %} class="col-sm-10"{% endif %}{% raw %}>
  <label for="{{ attrs.id }}">
    {% slot label %}
  {% endslot %}
</label>
</div>
<div{% endraw %}{% if cookiecutter.use_htmx_alpine_tailwind != 'y' %} class="col-sm-10"{% endif %}{% raw %}>
  <input {% if attrs.required %}required{% endif %}
         {% if attrs.disabled %}disabled{% endif %}
         {% if attrs.readonly %}readonly{% endif %}
         {% if attrs.checked %}checked{% endif %}
         {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
         {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
         {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
         {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
         value="{{ attrs.value|default_if_none:"" }}"
         type="{{ attrs.type }}"
         class="{% endraw %}{% if cookiecutter.use_htmx_alpine_tailwind == 'y' %}mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500{% else %}form-control{% endif %}{% raw %}" />
</div>
{% endif %}
{% if slots.help_text %}
  <div class="{% endraw %}{% if cookiecutter.use_htmx_alpine_tailwind == 'y' %}mt-1 text-sm text-gray-500{% else %}form-text{% endif %}{% raw %}">{% slot help_text %}{% endslot %}</div>
{% endif %}{% endraw %}
